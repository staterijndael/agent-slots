<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img">
<style>
  .bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#ffffff;stroke:#d0d7de}
  .t{fill:#1f2328;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .s{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .h{fill:#1f2328;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .m{fill:#1f2328;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .line{stroke:#8c959f;stroke-width:1.5;fill:none}
  .blue{fill:#ddf4ff;stroke:#54aeff}.green{fill:#dafbe1;stroke:#4ac26b}.amber{fill:#fff8c5;stroke:#d4a72c}
  .red{fill:#ffebe9;stroke:#ff8182}.violet{fill:#fbefff;stroke:#c297ff}
  .fblue{fill:#0969da}.fgreen{fill:#1a7f37}.famber{fill:#9a6700}.fred{fill:#cf222e}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d}.card{fill:#0d1117;stroke:#30363d}
    .t,.h,.m{fill:#e6edf3}.s{fill:#9198a1}.line{stroke:#6e7681}
    .blue{fill:#0c2d6b;stroke:#1f6feb}.green{fill:#0f3d1e;stroke:#2ea043}.amber{fill:#3b2e00;stroke:#9e6a03}
    .red{fill:#4c1018;stroke:#da3633}.violet{fill:#2c1a4d;stroke:#8957e5}
    .fblue{fill:#4493f8}.fgreen{fill:#3fb950}.famber{fill:#d29922}.fred{fill:#f85149}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8c959f"/></marker></defs>
<rect class="bg" width="900" height="340" rx="12"/>
<text class="h" x="24" y="36" text-anchor="start">Capacity follows live free memory, not a fixed number</text>
<text class="s" x="24" y="58" text-anchor="start">default ios-sim limits on an 18 GB Mac; checked before every grant, never against a slot already held</text>
<rect class="red" x="40" y="92" width="170" height="44"/>
<text class="t" x="125.0" y="112" text-anchor="middle">0 simulators</text>
<text class="s" x="125.0" y="128" text-anchor="middle">under 10% free</text>
<rect class="amber" x="210" y="92" width="170" height="44"/>
<text class="t" x="295.0" y="112" text-anchor="middle">1 simulator</text>
<text class="s" x="295.0" y="128" text-anchor="middle">10-20% free</text>
<rect class="green" x="380" y="92" width="480" height="44"/>
<text class="t" x="620.0" y="112" text-anchor="middle">2 simulators</text>
<text class="s" x="620.0" y="128" text-anchor="middle">20% free and more</text>
<rect class="line" x="40" y="92" width="820" height="44" rx="4"/>
<text class="s" x="40" y="154" text-anchor="middle">0%</text>
<text class="s" x="210" y="154" text-anchor="middle">10%</text>
<text class="s" x="380" y="154" text-anchor="middle">20%</text>
<text class="s" x="860" y="154" text-anchor="middle">100%</text>
<text class="s" x="450.0" y="174" text-anchor="middle">free memory (memory_pressure on macOS, MemAvailable on Linux); scale not linear</text>
<rect class="panel" x="40" y="210" width="820" height="32" rx="8"/>
<text class="t" x="56" y="231" text-anchor="start">swap over 90% and under 25% free</text>
<text class="h" x="400" y="231" text-anchor="start">→ 1</text>
<text class="s" x="500" y="231" text-anchor="start">swap alone stays allocated long after memory frees</text>
<rect class="panel" x="40" y="250" width="820" height="32" rx="8"/>
<text class="t" x="56" y="271" text-anchor="start">load over 3 per core</text>
<text class="h" x="400" y="271" text-anchor="start">→ 1</text>
<text class="s" x="500" y="271" text-anchor="start">compiles alone never stop simulators: never 0 from load</text>
<rect class="panel" x="40" y="290" width="820" height="32" rx="8"/>
<text class="t" x="56" y="311" text-anchor="start">build pool: under 25% free or load over 2</text>
<text class="h" x="400" y="311" text-anchor="start">→ 1 compile</text>
<text class="s" x="500" y="311" text-anchor="start">a second compile only when there is room</text>
</svg>
