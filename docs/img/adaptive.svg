<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img">
<style>
  .bg{fill:#ffffff}.panel{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#ffffff;stroke:#d0d7de}
  .t{fill:#1f2328;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .s{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .h{fill:#1f2328;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .m{fill:#1f2328;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .line{stroke:#8c959f;stroke-width:1.5;fill:none}
  .blue{fill:#ddf4ff;stroke:#54aeff}.green{fill:#dafbe1;stroke:#4ac26b}.amber{fill:#fff8c5;stroke:#d4a72c}
  .red{fill:#ffebe9;stroke:#ff8182}.violet{fill:#fbefff;stroke:#c297ff}
  .fblue{fill:#0969da}.fgreen{fill:#1a7f37}.famber{fill:#9a6700}.fred{fill:#cf222e}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d}.card{fill:#0d1117;stroke:#30363d}
    .t,.h,.m{fill:#e6edf3}.s{fill:#9198a1}.line{stroke:#6e7681}
    .blue{fill:#0c2d6b;stroke:#1f6feb}.green{fill:#0f3d1e;stroke:#2ea043}.amber{fill:#3b2e00;stroke:#9e6a03}
    .red{fill:#4c1018;stroke:#da3633}.violet{fill:#2c1a4d;stroke:#8957e5}
    .fblue{fill:#4493f8}.fgreen{fill:#3fb950}.famber{fill:#d29922}.fred{fill:#f85149}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8c959f"/></marker></defs>
<rect class="bg" width="900" height="330" rx="12"/>
<text class="h" x="24" y="36" text-anchor="start">The adaptive strategy picks a rule on every poll</text>
<text class="s" x="24" y="58" text-anchor="start">explicit --priority always first; every switch is logged and shown in slots status</text>
<rect class="blue" x="60" y="90" width="240" height="110" rx="14"/>
<text class="h" x="180" y="120" text-anchor="middle">fifo</text>
<text class="s" x="180" y="144" text-anchor="middle">every waiter fits in the</text>
<text class="s" x="180" y="162" text-anchor="middle">free units: order does</text>
<text class="s" x="180" y="180" text-anchor="middle">not matter</text>
<rect class="violet" x="330" y="90" width="240" height="110" rx="14"/>
<text class="h" x="450" y="120" text-anchor="middle">fair</text>
<text class="s" x="450" y="144" text-anchor="middle">one session has over half</text>
<text class="s" x="450" y="162" text-anchor="middle">of the work (held, recent,</text>
<text class="s" x="450" y="180" text-anchor="middle">waiting) and others wait</text>
<rect class="green" x="600" y="90" width="240" height="110" rx="14"/>
<text class="h" x="720" y="120" text-anchor="middle">short-first</text>
<text class="s" x="720" y="144" text-anchor="middle">more waiters than free units</text>
<text class="s" x="720" y="162" text-anchor="middle">and run times are known;</text>
<text class="s" x="720" y="180" text-anchor="middle">starved waiters go first</text>
<path class="line" d="M300,130 L328,130" marker-end="url(#a)"/>
<path class="line" d="M328,160 L302,160" marker-end="url(#a)"/>
<path class="line" d="M570,130 L598,130" marker-end="url(#a)"/>
<path class="line" d="M598,160 L572,160" marker-end="url(#a)"/>
<rect class="panel" x="60" y="226" width="780" height="84" rx="8"/>
<text class="t" x="76" y="250" text-anchor="start">short-first learns run times by itself</text>
<text class="s" x="76" y="272" text-anchor="start">the median of the last five runs of each kind of command: program + last plain word</text>
<text class="m" x="76" y="292" text-anchor="start">xcodebuild … build-for-testing   ·   xcodebuild … test-without-building   ·   bazel build</text>
</svg>
