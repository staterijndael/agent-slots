name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, python: '3.9'}   # the macOS system python3
          - {os: macos-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.10'} # setup-python has no 3.9 for the current Ubuntu
          - {os: ubuntu-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover tests -v
