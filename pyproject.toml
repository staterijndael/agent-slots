[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-slots"
version = "0.2.0"
description = "Share scarce machine resources (simulators, emulators, builds, browsers, GPUs) between parallel AI agent sessions, without a daemon"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
slots = "agent_slots.cli:main"

[tool.setuptools]
packages = ["agent_slots"]
